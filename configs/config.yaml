# Radar Threat Classifier Configuration

# Paths
paths:
  data_raw: "data/raw"
  data_real: "data/real"
  data_processed: "data/processed"
  data_synthetic: "data/synthetic"
  models: "outputs/models"
  logs: "outputs/logs"

# Data Source Policy
data_policy:
  real_only: false
  allow_synthetic_fallback: true
  required_real_datasets: []

# Dataset Configuration
dataset:
  source: "synthetic"
  primary_real_dataset: "mafat"
  classes:
    - "Drone"
    - "Aircraft"
    - "Bird"
    - "Clutter"
    - "Noise"
  num_classes: 5
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
  mafat:
    map_humans_to: "Drone"
    include_auxiliary: true

# Radar Signal Parameters
radar:
  carrier_frequency: 24.0e9  # 24 GHz (typical for drone detection)
  sampling_rate: 10000       # Hz
  prf: 1000                  # Pulse Repetition Frequency (Hz)
  num_pulses: 32             # Number of pulses per CPI
  num_samples: 128           # Samples per pulse

# Preprocessing Parameters
preprocessing:
  fft_size: 128
  window_type: "hann"
  overlap: 0.5
  normalize_method: "minmax"  # Options: minmax, zscore
  denoise_method: "wavelet"   # Options: wavelet, median, gaussian

# Feature Extraction
features:
  use_spectrogram: true
  use_doppler_sequence: true
  use_environmental: true
  spectrogram_size: [32, 128]  # [time_bins, freq_bins]
  doppler_sequence_length: 32
  environmental_features:
    - "rain"        # mm/hr
    - "temperature" # Celsius
    - "pressure"    # hPa

# Model Architecture
model:
  name: "RadarClassifier"
  cnn:
    channels: [32, 64, 128]
    kernel_size: 3
    pool_size: 2
  lstm:
    input_size: 1
    hidden_size: 64
    num_layers: 2
    bidirectional: true
  env_feature_dim: 3
  env_hidden_size: 16
  fc_hidden: 256
  dropout: 0.35

# Training Configuration
training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler:
    type: "cosine"  # Options: cosine, step, plateau
    warmup_epochs: 5
  early_stopping:
    patience: 15
    min_delta: 0.001
  class_weights: "balanced"  # Options: balanced, null, or list of weights

# Data Augmentation
augmentation:
  enabled: true
  time_shift: 0.1         # Max shift as fraction of signal length
  frequency_shift: 0.05   # Max shift as fraction of bandwidth
  noise_injection: 0.1    # SNR for added noise
  amplitude_scale: [0.8, 1.2]

# Synthetic Data Generation
synthetic:
  num_samples_per_class: 2000
  aircraft:
    jet_types: ["f16", "f22_stealth", "su27", "commercial", "turboprop"]
    velocity_range: [120, 800]  # m/s  (covers subsonic to Mach 2.3+)
    rcs_range: [0.0001, 120]    # m^2  (stealth to large transport)
  drone:
    velocity_range: [0, 30]     # m/s
    rotor_frequencies: [50, 200]  # Hz
    num_rotors: [3, 4, 6]
  bird:
    velocity_range: [5, 25]     # m/s
    wingbeat_frequencies: [2, 15]  # Hz

# Evaluation
evaluation:
  metrics:
    - "accuracy"
    - "f1_macro"
    - "f1_weighted"
    - "confusion_matrix"
  target_accuracy: 0.85
  target_f1: 0.80

# Inference Trust Policy
inference:
  use_confidence_scaled_threat: true
  class_confidence_thresholds:
    Drone: 0.80
    Aircraft: 0.75
    Bird: 0.60
    Clutter: 0.55
    Noise: 0.50

# Hardware
hardware:
  device: "auto"  # Options: auto, cuda, cpu
  num_workers: 0
  pin_memory: false

# =============================================================================
# RL Gatekeeper  (computational gatekeeper that decides DISCARD vs FORWARD)
# =============================================================================
# Data flow:
#   Raw IQ -> preprocessing -> feature tensor X = {rd_map, doppler, env}
#   X -> RL gatekeeper -> action {0=DISCARD, 1=FORWARD}
#        FORWARD -> X -> ML classifier (the expensive deep inspection)
#        DISCARD -> stop (ML inference skipped -> compute saved)
# The RL agent consumes the EXACT same tensor X that the ML model consumes;
# it never sees the ML output (that would defeat the compute-savings goal).
rl:
  # ── Data source for training the gatekeeper ──────────────────────────────
  # The gatekeeper trains on the same feature distribution the ML model sees.
  data_source: "mixed"        # Options: zenodo (real 77GHz), synthetic, mixed
  synthetic_per_class: 600    # used when data_source includes synthetic
  zenodo_max_segments: null   # null = use all available real segments
  pool_seed: 42

  # ── Feature encoder (lightweight, must be far cheaper than the ML model) ──
  encoder:
    conv_channels: [8, 16]    # tiny CNN over the RD map (vs [32,64,128] in ML)
    kernel_size: 3
    pool_size: 2
    adaptive_pool: [2, 2]
    side_hidden: 16           # MLP width for doppler + env side features
    latent_dim: 64            # shared latent fed to the dueling head

  # ── Dueling DQN head ─────────────────────────────────────────────────────
  head:
    hidden_dims: [128, 64]
    stream_hidden: 64

  # ── DQN agent hyperparameters ────────────────────────────────────────────
  agent:
    lr: 0.0005
    gamma: 0.0                # myopic: each signal is an i.i.d. bandit decision
    eps_start: 1.0
    eps_end: 0.02
    eps_decay: 0.997
    batch_size: 64
    target_update: 250
    tau: 1.0
    grad_clip: 10.0
    buffer_capacity: 20000
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 80000

  # ── Curriculum (teacher = ML classifier / oracle value-of-information) ────
  curriculum:
    warmup_episodes: 40       # Phase 1: oracle teacher demonstrations
    guided_episodes: 80       # Phase 2: teacher ratio annealed 0.9 -> 0
    rl_episodes: 250          # Phase 3: pure epsilon-greedy RL
    steps_per_episode: 400
    teacher_ratio_start: 0.9
    eval_episodes: 20
    seed: 42

  # ── Model selection (safety) ─────────────────────────────────────────────
  # Best checkpoint = highest eval reward AMONG policies whose true threat
  # recall >= min_threat_recall (so compute savings never come at the cost of
  # missed threats). Falls back to the highest-recall policy if none qualify.
  selection:
    min_threat_recall: 0.90

  # ── Paths ────────────────────────────────────────────────────────────────
  # The teacher must match the data domain so its confidence/correctness (which
  # score the reward) are reliable: synthetic data -> synthetic-trained model,
  # real 77GHz data -> Zenodo-fine-tuned model.
  ml_model_by_source:
    synthetic: "outputs/models/best_model.pt"
    zenodo: "outputs/models/best_model_zenodo.pt"
    mixed: "outputs/models/best_model_zenodo.pt"
  ml_model_path: "outputs/models/best_model_zenodo.pt"   # fallback / --ml-model override
  save_path: "outputs/models/gatekeeper_dqn.pt"
  registry_name: "radar_rl_gatekeeper"

# =============================================================================
# Reward function  (Value-of-Information: Utility = Detection - Compute Cost)
# =============================================================================
# Let  U_surplus = U_ml(X) - kappa   (net value of inspecting this signal):
#   Reward(FORWARD) = U_surplus - eta * max(0, rho - rho*)
#   Reward(DISCARD) = - beta * max(0, U_surplus)
# where
#   U_ml(X)   = class_value[y] * (2*correct - 1) * certainty
#   certainty = alpha * confidence + (1 - alpha) * (1 - normalized_entropy)
# This yields the clean value-of-information rule "forward iff U_ml >= kappa",
# while beta makes discarding a *worth-forwarding* signal costly in proportion
# to its surplus value (the false-negative asymmetry) WITHOUT lowering the bar.
# class_value[y] is threat-centric (operational stakes) modulated by the data
# frequency; every coefficient lives here, none are hardcoded in code.
reward:
  compute_cost: 0.35          # kappa: cost of one ML inference (utility units)
  miss_aversion: 3.0          # beta: penalty multiplier for discarding a worth-forwarding signal
  certainty_blend: 0.5        # alpha: confidence vs (1 - entropy) blend
  value_gamma: 0.5            # exponent on inverse class frequency (within-group modulation)
  value_clip: [0.1, 3.0]      # clamp derived class values to a sane range
  threat_classes: ["Drone", "Aircraft"]
  threat_value: 1.5           # operational value of a (confirmable) threat detection
  nonthreat_value: 0.25       # operational value of inspecting a non-threat (< kappa region)
  forward_budget: null        # rho*: target forward rate; null = derive from data
  budget_penalty: 1.0         # eta: penalty per unit of over-budget forwarding

# =============================================================================
# MLOps / Experiment Tracking
# =============================================================================
tracking:
  experiment_name: "radar_rl_gatekeeper"
  tracking_uri: "outputs/mlruns"
  use_mlflow: true
  registry_dir: "outputs/model_registry"
